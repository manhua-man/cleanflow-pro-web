<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Subtle Internal Glow Grid -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1.5" />
  <circle cx="64" cy="64" r="28" fill="none" stroke="rgba(16, 185, 129, 0.08)" stroke-width="1.5" />

  <!-- Shield Crest & Dynamic Clean Flow -->
  <g filter="url(#glow)">
    <!-- Stream Vector Flow (Left) -->
    <path d="M34 46 C34 36, 48 30, 64 30 C80 30, 94 36, 94 46 C94 62, 78 78, 64 94 C50 78, 34 62, 34 46 Z" 
          fill="none" stroke="url(#flowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner Core Lightning Flow -->
    <path d="M50 48 C50 42, 56 38, 64 38 C72 38, 78 42, 78 48 C78 58, 68 68, 64 78 C60 68, 50 58, 50 48 Z" 
          fill="url(#flowGrad)" opacity="0.35"/>

    <!-- Search Ray Crosshair / Focal Lens -->
    <circle cx="64" cy="52" r="14" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" />
    <path d="M74 62 L86 74" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Spark Pulse -->
    <circle cx="64" cy="52" r="3.5" fill="#ffffff" />
  </g>
</svg>
